[global]
strict init = true
reload conf period = 0
rotate lock file = /tmp/log_osxrdp_serverapp.lock
file perms = 644
default format = "main"

[formats]
main = "%d(%F %T) %-5V [%p] %m%n"

[rules]
*.* "/Library/Logs/osxrdp/%E(USER)/osxrdp.log", 10MB * 7 ~ "/Library/Logs/osxrdp/%E(USER)/osxrdp.#2r.log"; main
