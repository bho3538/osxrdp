[global]
strict init = true
reload conf period = 0
rotate lock file = /tmp/log_osxrdp_sessionmanager.lock
file perms = 644
default format = "main"

[formats]
main = "%d(%F %T) %-5V [%p] %m%n"

[rules]
*.* "/Library/Logs/osxrdp/osxrdp_sessionmanager.log", 10MB * 7 ~ "/Library/Logs/osxrdp/osxrdp_sessionmanager.#2r.log"; main

